# Backup ANCHOR server on any machine with Docker (e.g. an Oracle Cloud Always
# Free VM): PostgreSQL + the server with its workers. Always on.
#
#   python scripts/make-backup-keys.py      # once: writes .env.backup
#   docker compose --env-file .env.backup up -d --build
#   curl http://localhost:8000/healthz
#
# Put HTTPS in front (Caddy, see docs/deploy/BACKUP-HOSTING.md) before a phone uses it.
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: vuka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.backup}
      POSTGRES_DB: vuka
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuka -d vuka"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.backup
    environment:
      DATABASE_URL: postgresql://vuka:${POSTGRES_PASSWORD}@db:5432/vuka
      PORT: "8000"
    ports:
      - "${VUKA_PORT:-8000}:8000"

volumes:
  pgdata:
