name: security-score
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  security-score:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Prepare per-test results directory
        run: mkdir -p results
      - name: Install root Node dependencies
        run: npm ci
      - name: Check generated security controls register
        run: node scripts/build-controls-register.mjs --check
      - name: Run root Node tests with TAP results
        id: node-tests
        continue-on-error: true
        run: node --test --test-reporter=tap "test/**/*.test.mjs" > results/node.tap 2>&1
      - name: Run Vitest with JUnit results
        id: vitest
        continue-on-error: true
        run: |
          npm ci --prefix shared
          npm test --prefix shared -- --reporter=junit --outputFile=../results/vitest.junit.xml
      - name: Run Python tests with JUnit results when present
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find anchor/tests server/tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print 2>/dev/null | sort)
          if ((${#tests[@]} == 0)); then
            printf '<testsuites tests="0" failures="0" errors="0" skipped="0"></testsuites>\n' > results/pytest.junit.xml
          else
            python -m pip install --disable-pip-version-check pytest==8.4.2
            python -m pytest "${tests[@]}" --junitxml=results/pytest.junit.xml
          fi
      - name: Write exact-commit CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_OUTCOME: ${{ steps.node-tests.outcome }}
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh run list --commit "${{ github.sha }}" --workflow checks.yml --json conclusion,url,headSha > checks-runs.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runs = JSON.parse(fs.readFileSync('checks-runs.json', 'utf8'));
          const latest = runs.find(run => run.headSha === process.env.HEAD_SHA);
          fs.mkdirSync('results', { recursive: true });
          fs.writeFileSync('results/ci-status.json', JSON.stringify({
            status: latest?.conclusion || 'not_found',
            head_sha: latest?.headSha || null,
            run_url: latest?.url || process.env.RUN_URL
          }, null, 2) + '\n');
          NODE
      - name: Compute evidence score from per-test results
        if: always()
        run: node scripts/security-score.mjs --commit "${{ github.sha }}" --results results --out security-score.json
      - name: Select the latest completed main score as the regression baseline
        id: baseline
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh run list --branch main --workflow security-score.yml --status success --json databaseId,headSha --limit 20 > baseline-runs.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runs = JSON.parse(fs.readFileSync('baseline-runs.json', 'utf8'));
          const baseline = runs.find(run => run.headSha !== process.env.GITHUB_SHA);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${baseline?.databaseId || ''}\n`);
          NODE
      - name: Check high-weight levels against main
        if: always() && steps.baseline.outputs.run_id != '' && hashFiles('security-score.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh run download "${{ steps.baseline.outputs.run_id }}" --name security-score --dir baseline && test -f baseline/security-score.json; then
            node scripts/security-score.mjs --commit "${{ github.sha }}" --results results --check-regression baseline/security-score.json --out security-score.json
          else
            echo 'No downloadable main score artifact; regression baseline unavailable on this run.'
          fi
      - name: Upload score, per-test results and page sources
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-score
          path: |
            security-score.json
            results/
            dashboard/security.html
            dashboard/security.js
          if-no-files-found: warn
          retention-days: 90
      - name: Fail the workflow if any test suite failed
        if: always()
        env:
          NODE_OUTCOME: ${{ steps.node-tests.outcome }}
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          test "$NODE_OUTCOME" = success && test "$VITEST_OUTCOME" = success && test "$PYTEST_OUTCOME" = success

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: security-score
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download score and page sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: security-score
          path: payload
      - name: Assemble static site
        run: |
          mkdir site
          cp payload/dashboard/security.html payload/dashboard/security.js payload/security-score.json site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
