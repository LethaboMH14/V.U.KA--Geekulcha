name: security-score
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  security-score:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Prepare per-test results directory
        run: mkdir -p results
      - name: Install root Node dependencies
        run: npm ci
      - name: Check generated security controls register
        run: node scripts/build-controls-register.mjs --check
      - name: Run root Node tests with TAP results
        id: node-tests
        continue-on-error: true
        run: node --test --test-reporter=tap "test/**/*.test.mjs" > results/node.tap 2>&1
      - name: Run Vitest with JUnit results
        id: vitest
        continue-on-error: true
        run: |
          npm ci --prefix shared
          npm test --prefix shared -- --reporter=junit --outputFile=../results/vitest.junit.xml
      - name: Run Python tests with JUnit results when present
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find anchor/tests server/tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print 2>/dev/null | sort)
          if ((${#tests[@]} == 0)); then
            printf '<testsuites tests="0" failures="0" errors="0" skipped="0"></testsuites>\n' > results/pytest.junit.xml
          else
            python -m pip install --disable-pip-version-check pytest==8.4.2
            python -m pytest "${tests[@]}" --junitxml=results/pytest.junit.xml
          fi
      - name: Write exact-commit CI status
        if: always()
        env:
          NODE_OUTCOME: ${{ steps.node-tests.outcome }}
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --commit "${{ github.sha }}" --workflow checks.yml --json conclusion,url,headSha > checks-runs.json
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const runs = JSON.parse(fs.readFileSync('checks-runs.json', 'utf8'));
          const latest = runs.find(run => run.headSha === process.env.HEAD_SHA);
          fs.mkdirSync('results', { recursive: true });
          fs.writeFileSync('results/ci-status.json', JSON.stringify({
            status: latest?.conclusion || 'not_found',
            head_sha: latest?.headSha || null,
            run_url: latest?.url || process.env.RUN_URL
          }, null, 2) + '\n');
          const files = [];
          const visit = dir => {
            for (const item of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, item.name);
              if (item.isDirectory()) visit(full);
              else if (item.isFile() && /\.(?:tap|xml)$/i.test(item.name)) {
                files.push({ name: path.relative('results', full).split(path.sep).join('/'), sha256: crypto.createHash('sha256').update(fs.readFileSync(full)).digest('hex') });
              }
            }
          };
          visit('results');
          files.sort((a, b) => a.name.localeCompare(b.name));
          fs.writeFileSync('results/results-manifest.json', JSON.stringify({ head_sha: process.env.HEAD_SHA, files }, null, 2) + '\n');
          NODE
      - name: Resolve scored commit timestamp
        id: commit-metadata
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "timestamp=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.committer.date')" >> "$GITHUB_OUTPUT"
      - name: Compute evidence score from per-test results
        if: always()
        run: node scripts/security-score.mjs --commit "${{ github.sha }}" --generated-at "${{ steps.commit-metadata.outputs.timestamp }}" --results results --out security-score.json
      - name: Select the latest completed main score as the regression baseline
        id: baseline
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh run list --branch main --workflow security-score.yml --status success --json databaseId,headSha --limit 20 > baseline-runs.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runs = JSON.parse(fs.readFileSync('baseline-runs.json', 'utf8'));
          const baseline = runs.find(run => run.headSha !== process.env.GITHUB_SHA);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${baseline?.databaseId || ''}\n`);
          NODE
      - name: Check high-weight levels against main
        if: always() && steps.baseline.outputs.run_id != '' && hashFiles('security-score.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh run download "${{ steps.baseline.outputs.run_id }}" --name security-score --dir baseline && test -f baseline/security-score.json; then
            node scripts/security-score.mjs --commit "${{ github.sha }}" --generated-at "${{ steps.commit-metadata.outputs.timestamp }}" --results results --check-regression baseline/security-score.json --out security-score.json
          else
            echo 'No downloadable main score artifact; regression baseline unavailable on this run.'
          fi
      - name: Upload score, per-test results and page sources
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-score
          path: |
            security-score.json
            results/
            dashboard/security.html
            dashboard/security.js
          if-no-files-found: warn
          retention-days: 90
      - name: Fail the workflow if any test suite failed
        if: always()
        env:
          NODE_OUTCOME: ${{ steps.node-tests.outcome }}
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          test "$NODE_OUTCOME" = success && test "$VITEST_OUTCOME" = success && test "$PYTEST_OUTCOME" = success

  # Pages is deployed by ledger-pages.yml alone. It re-runs after every
  # security-score run on main and carries security.html, security.js and
  # security-score.json from this workflow's artifact. A second deploy here
  # replaced the whole site with only the score page (a repo has one Pages
  # site), so the ledger 404'd until ledger-pages redeployed.
