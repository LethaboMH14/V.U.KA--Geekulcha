name: Repository gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks 8.24.3
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan all fetched history and working files
        run: |
          gitleaks git --redact --config .gitleaks.toml --log-opts="--all"
          gitleaks dir --redact --config .gitleaks.toml .
      - name: Exercise actual pre-commit failure behaviour in isolated fixtures
        run: node scripts/test-security.mjs "$RUNNER_TEMP/gitleaks"
  document-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify documents and feature-intake gate
        run: |
          node --version
          node scripts/check-docs.mjs
          node scripts/check-intake.mjs
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Run root Node contract tests
        run: |
          npm ci
          node --test "test/**/*.test.mjs"
      - name: Run shared library Vitest suite
        working-directory: shared
        run: |
          npm ci
          npm test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Run ANCHOR and server Python tests when present
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find anchor/tests server/tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print 2>/dev/null | sort)
          if ((${#tests[@]} == 0)); then
            echo "No anchor/tests or server/tests Python tests are present; skipped."
          else
            python -m pip install --disable-pip-version-check pytest==8.4.2
            python -m pytest anchor/tests server/tests
          fi
  npm-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Audit root and shared lockfiles
        run: |
          npm ci
          npm audit
          npm ci --prefix shared
          npm audit --prefix shared
  python-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Audit declared ANCHOR and server Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find anchor server -type f \( -name 'requirements.txt' -o -name 'requirements-*.txt' \) -print | sort)
          if ((${#manifests[@]} == 0)); then
            echo "No ANCHOR or server requirements manifests exist; pip-audit not applicable yet."
          else
            python -m pip install --disable-pip-version-check pip-audit==2.10.1
            for manifest in "${manifests[@]}"; do
              echo "Auditing ${manifest}"
              python -m pip_audit --requirement "${manifest}"
            done
          fi
  semgrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.177.0
      # p/security-audit is selected to catch common exploitable security patterns.
      - name: Scan repository with Semgrep security audit rules
        run: semgrep scan --error --metrics=off --config p/security-audit .
  osv-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Scan repository manifests with digest-pinned OSV-Scanner v2.6.0
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/src"
          -w /src
          ghcr.io/google/osv-scanner:v2.6.0-amd64@sha256:b8cc6dc8805bb77fca4ada69c07cfef5a1e07784c22830e0bd49a440aa27d9fe
          scan source --recursive .
