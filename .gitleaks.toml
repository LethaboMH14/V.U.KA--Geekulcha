title = "VUKA clean-history scanning"

[extend]
useDefault = true

[[rules]]
id = "vuka-synthetic-test-secret"
description = "Deliberately noncredential fixture for exercising the scanner gate"
regex = '''VUKA_TEST_SECRET_[A-Z0-9]{24}'''

# Allowlist for one known false positive (18 Oct 2026). Commit 89f8f1cdb230d641e4a42274fd0ab4e7bfc92e0b on
# feature/ui (Mutarisi) has the word "tokens" in an XML comment at
# themes.xml line 8 of both theme files; the default generic-api-key rule reads
# it as a credential. It holds no secret. CI scans every branch's history, so
# the commit turned the secret-scan job red on every PR. Scoped to this commit
# and this rule only: any other finding, in any other commit, still fails.
[allowlist]
description = "feature/ui themes.xml comment mentioning tokens; not a credential"
commits = ["89f8f1cdb230d641e4a42274fd0ab4e7bfc92e0b"]
